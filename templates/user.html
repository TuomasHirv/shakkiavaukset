<h1>{{ username }}</h1>

<p><strong>Tykkäykset:</strong> {{ total_likes }}</p>

<table>
    <tr>
        <th>Nimi</th>
        <th>ECO</th>
        <th>Kuvaus</th>
        <th>Tykkäykset</th>
    </tr>

    {% for a in avaukset %}
    <tr>
        <td>
            <a href="{{ url_for('opening_detail', opening_id=a[0]) }}">{{ a[1] }}</a>
        </td>
        <td>{{ a[3] }}</td>
        <td>{{ a[2] }}</td>
        <td>{{ a[4] }}</td>
    </tr>
    {% endfor %}
</table>

<table>
    <tr>
        <th>Teksti</th>
        <th>Likes</th>
        <th>Avaus</th>
    </tr>

    {% for k in kommentit %}
    <tr>
        <td>{{ k[2] }}</td>
        <td>{{ k[3] }}</td>
        <td><a href="{{ url_for('opening_detail', opening_id=k[1]) }}">{{ k[4] }}</a></td>
    </tr>
    {% endfor %}

</table>
